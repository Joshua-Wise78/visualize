[project]
name = "visualize"
version = "0.1.0"
description = "Visualize datastructures inside of the terminal!"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "slowapi>=0.1.9",
]

[tool.pyright]
reportUntypedFunctionDecorator = false

[tool.pytest.ini_options]
pythonpath = [
    "."
]
